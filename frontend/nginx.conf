# Отдача собранного SPA и проксирование на backend.
#
# Один порт наружу — так проверяющему не нужно знать про два адреса, а
# браузеру не нужен CORS: и статика, и API приходят с одного origin.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Хешированные ассеты Vite неизменяемы — кешируем надолго.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html не кешируем: иначе после передеплоя браузер тянет старые ссылки.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass         http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Раунд длится десятки секунд; таймаут по умолчанию тут ни при чём,
        # но оставляем запас для долгих административных симуляций.
        proxy_read_timeout 120s;
    }

    # WebSocket требует явного upgrade, иначе соединение закроется на прокси.
    location /ws/ {
        proxy_pass         http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Swagger UI и схема — чтобы эксперт открывал их с того же адреса, что игру.
    location ~ ^/(swagger-ui|v3/api-docs|actuator) {
        proxy_pass       http://backend:8081;
        proxy_set_header Host $host;
    }

    # SPA: любой неизвестный путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
